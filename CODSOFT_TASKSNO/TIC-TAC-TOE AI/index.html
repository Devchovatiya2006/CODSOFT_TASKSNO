<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe <span>AI</span></h1>

    <div class="score-board">
      <div class="score">
        <span class="label">You (X)</span>
        <span class="value" id="score-human">0</span>
      </div>
      <div class="score">
        <span class="label">Draw</span>
        <span class="value" id="score-draw">0</span>
      </div>
      <div class="score">
        <span class="label">AI (O)</span>
        <span class="value" id="score-ai">0</span>
      </div>
    </div>

    <div class="status" id="status">Your turn!</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
      <button id="restart-btn">New Game</button>
      <div class="toggle-group">
        <span>First Move:</span>
        <button class="toggle active" id="btn-human" onclick="setFirst('human')">You</button>
        <button class="toggle" id="btn-ai" onclick="setFirst('ai')">AI</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="result-card">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-text" id="result-text"></div>
      <button onclick="closeOverlay()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
